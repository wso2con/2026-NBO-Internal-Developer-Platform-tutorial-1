apiVersion: openchoreo.dev/v1alpha1

metadata:
  name: loan-api-go

endpoints:
  - name: http
    port: 8080
    type: HTTP
    visibility:
      - external          # public-api REQUIRES an external endpoint

configurations:
  env:
    - name: PORT
      value: "8080"
    - name: LOG_LEVEL
      value: info
    - name: SCORING_TIMEOUT_MS
      value: "2000"

dependencies:
  resources:
    - ref: loans-db
      envBindings:
        url: DATABASE_URL
    - ref: loan-events
      envBindings:
        url: NATS_URL
  endpoints:
    - component: credit-scoring
      name: http
      visibility: project
      envBindings:
        address: CREDIT_SCORING_URL
