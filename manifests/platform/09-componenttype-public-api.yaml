# P5e — public-api
#
# FOR: loan-api-go, the bank's customer-facing API. DERIVED FROM the shipped
# ClusterComponentType/service, keeping httproute-external. The rule that matters
# is the INVERSE of internal-engine's: a public API MUST declare an external
# endpoint. Choosing this type is an explicit statement that the component faces
# the world — not something that happens by leaving a default alone.
#
# allowedWorkflows is dockerfile-builder only: the bank's public entry point is
# built by the platform from source in git, by an approved pipeline, and runs two
# replicas in production. Nothing here decides the language.
#
# Developers reference this as: deployment/public-api
---
apiVersion: openchoreo.dev/v1alpha1
kind: ComponentType
metadata:
  name: public-api
  namespace: kifaru-bank
  annotations:
    openchoreo.dev/display-name: Kifaru Public API
    openchoreo.dev/description: A customer-facing API published through the gateway
      and built from a Dockerfile in the application repository.
spec:
  allowedTraits:
  - kind: ClusterTrait
    name: observability-alert-rule
  allowedWorkflows:
  - kind: ClusterWorkflow
    name: dockerfile-builder
  environmentConfigs:
    openAPIV3Schema:
      "$defs":
        ResourceQuantity:
          default: {}
          properties:
            cpu:
              default: 100m
              type: string
            memory:
              default: 256Mi
              type: string
          type: object
        ResourceRequirements:
          default: {}
          properties:
            limits:
              "$ref": "#/$defs/ResourceQuantity"
            requests:
              "$ref": "#/$defs/ResourceQuantity"
          type: object
      properties:
        imagePullPolicy:
          default: IfNotPresent
          enum:
          - Always
          - IfNotPresent
          - Never
          type: string
        replicas:
          default: 1
          minimum: 0
          type: integer
        resources:
          "$ref": "#/$defs/ResourceRequirements"
      type: object
  resources:
  - id: deployment
    targetPlane: dataplane
    template:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        labels: "${metadata.labels}"
        name: "${metadata.name}"
        namespace: "${metadata.namespace}"
      spec:
        replicas: "${environmentConfigs.replicas}"
        selector:
          matchLabels: "${metadata.podSelectors}"
        template:
          metadata:
            labels: "${metadata.podSelectors}"
          spec:
            containers:
            - args: "${has(workload.container.args) ? workload.container.args : oc_omit()}\n"
              command: "${has(workload.container.command) ? workload.container.command
                : oc_omit()}\n"
              env: "${dependencies.toContainerEnvs()}"
              envFrom: "${configurations.toContainerEnvFrom()}"
              image: "${workload.container.image}"
              imagePullPolicy: "${environmentConfigs.imagePullPolicy}"
              name: main
              resources:
                limits:
                  cpu: "${environmentConfigs.resources.limits.cpu}"
                  memory: "${environmentConfigs.resources.limits.memory}"
                requests:
                  cpu: "${environmentConfigs.resources.requests.cpu}"
                  memory: "${environmentConfigs.resources.requests.memory}"
              volumeMounts: "${configurations.toContainerVolumeMounts() + dependencies.toContainerVolumeMounts()}"
            volumes: "${configurations.toVolumes() + dependencies.toVolumes()}"
  - id: service
    includeWhen: "${size(workload.endpoints) > 0}"
    targetPlane: dataplane
    template:
      apiVersion: v1
      kind: Service
      metadata:
        labels: "${metadata.labels}"
        name: "${metadata.componentName}"
        namespace: "${metadata.namespace}"
      spec:
        ports: "${workload.toServicePorts()}"
        selector: "${metadata.podSelectors}"
        type: ClusterIP
  - forEach: ${workload.endpoints.transformMap(name, ep, "external" in ep.visibility
      && ep.type in ["HTTP", "GraphQL", "Websocket"], ep)}
    id: httproute-external
    targetPlane: dataplane
    template:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        labels: '${oc_merge(metadata.labels, {"openchoreo.dev/endpoint-name": endpoint.key,
          "openchoreo.dev/endpoint-visibility": "external"})}'
        name: "${oc_generate_name(metadata.componentName, endpoint.key)}"
        namespace: "${metadata.namespace}"
      spec:
        hostnames: |
          ${[gateway.ingress.external.?http, gateway.ingress.external.?https]
            .filter(g, g.hasValue()).map(g, g.value().host).distinct()
            .map(h, metadata.environmentName + "-" + metadata.componentNamespace + "." + h)}
        parentRefs:
        - name: "${gateway.ingress.external.name}"
          namespace: "${gateway.ingress.external.namespace}"
        rules:
        - backendRefs:
          - name: "${metadata.componentName}"
            port: "${endpoint.value.port}"
          filters:
          - type: URLRewrite
            urlRewrite:
              path:
                replacePrefixMatch: ${endpoint.value.?basePath.orValue("/")}
                type: ReplacePrefixMatch
          - cors:
              allowCredentials: false
              allowHeaders:
              - "*"
              allowMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
              - HEAD
              allowOrigins:
              - "*"
              exposeHeaders:
              - "*"
            type: CORS
          matches:
          - path:
              type: PathPrefix
              value: "/${metadata.componentName}-${endpoint.key}"
    var: endpoint
  - forEach: ${workload.endpoints.transformMap(name, ep, "internal" in ep.visibility
      && ep.type in ["HTTP", "GraphQL", "Websocket"], ep)}
    id: httproute-internal
    targetPlane: dataplane
    template:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        labels: '${oc_merge(metadata.labels, {"openchoreo.dev/endpoint-name": endpoint.key,
          "openchoreo.dev/endpoint-visibility": "internal"})}'
        name: ${oc_generate_name(metadata.componentName, endpoint.key, "internal")}
        namespace: "${metadata.namespace}"
      spec:
        hostnames: |
          ${[gateway.ingress.internal.?http, gateway.ingress.internal.?https]
            .filter(g, g.hasValue()).map(g, g.value().host).distinct()
            .map(h, metadata.environmentName + "-" + metadata.componentNamespace + "." + h)}
        parentRefs:
        - name: "${gateway.ingress.internal.name}"
          namespace: "${gateway.ingress.internal.namespace}"
        rules:
        - backendRefs:
          - name: "${metadata.componentName}"
            port: "${endpoint.value.port}"
          filters:
          - type: URLRewrite
            urlRewrite:
              path:
                replacePrefixMatch: ${endpoint.value.?basePath.orValue("/")}
                type: ReplacePrefixMatch
          matches:
          - path:
              type: PathPrefix
              value: "/${metadata.componentName}-${endpoint.key}"
    var: endpoint
  - forEach: "${configurations.toConfigEnvsByContainer()}"
    id: env-config
    targetPlane: dataplane
    template:
      apiVersion: v1
      data: "${envConfig.envs.transformMapEntry(index, env, {env.name: env.value})}\n"
      kind: ConfigMap
      metadata:
        name: "${envConfig.resourceName}"
        namespace: "${metadata.namespace}"
    var: envConfig
  - forEach: "${configurations.toConfigFileList()}"
    id: file-config
    targetPlane: dataplane
    template:
      apiVersion: v1
      data:
        "${config.name}": "${config.value}\n"
      kind: ConfigMap
      metadata:
        name: "${config.resourceName}"
        namespace: "${metadata.namespace}"
    var: config
  - forEach: "${configurations.toSecretEnvsByContainer()}"
    id: secret-env-external
    targetPlane: dataplane
    template:
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: "${secretEnv.resourceName}"
        namespace: "${metadata.namespace}"
      spec:
        data: |
          ${secretEnv.envs.map(secret, {
            "secretKey": secret.name,
            "remoteRef": {
              "key": secret.remoteRef.key,
              ?"property": secret.remoteRef.?property
            }
          })}
        refreshInterval: 15s
        secretStoreRef:
          kind: ClusterSecretStore
          name: "${dataplane.secretStore}"
        target:
          creationPolicy: Owner
          name: "${secretEnv.resourceName}"
    var: secretEnv
  - forEach: "${configurations.toSecretFileList()}"
    id: secret-file-external
    targetPlane: dataplane
    template:
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: "${file.resourceName}"
        namespace: "${metadata.namespace}"
      spec:
        data:
        - remoteRef:
            key: "${file.remoteRef.key}"
            property: "${has(file.remoteRef.property) ? file.remoteRef.property :
              oc_omit()}\n"
          secretKey: "${file.name}"
        refreshInterval: 15s
        secretStoreRef:
          kind: ClusterSecretStore
          name: "${dataplane.secretStore}"
        target:
          creationPolicy: Owner
          name: "${file.resourceName}"
    var: file
  validations:
  - rule: ${workload.endpoints.exists(name, ep, "external" in ep.visibility)}
    message: A public API must declare at least one external endpoint. Use 'deployment/internal-engine'
      for services that stay inside the cell.
  - message: Endpoints with 'external' visibility require gateway.ingress.external
      to be configured on the Environment or DataPlane.
    rule: |-
      ${workload.endpoints.exists(name, ep, "external" in ep.visibility)
        ? has(gateway.ingress) && has(gateway.ingress.external)
        : true}
  - message: Endpoints with 'internal' visibility require gateway.ingress.internal
      to be configured on the Environment or DataPlane.
    rule: |-
      ${workload.endpoints.exists(name, ep, "internal" in ep.visibility)
        ? has(gateway.ingress) && has(gateway.ingress.internal)
        : true}
  - rule: ${metadata.environmentName != "production" || environmentConfigs.replicas
      >= 2}
    message: Production requires at least two replicas. Single-replica workloads are
      not permitted in a production environment.
  workloadType: deployment
