# D6 — loan-api-go, the ONE component the platform builds from source.
#
# GENERATED BY:
#   occ component scaffold loan-api-go --componenttype deployment/public-api \
#     --clusterworkflow dockerfile-builder -n kifaru-bank -p lending
#
# public-api allows dockerfile-builder and nothing else: the bank's public entry
# point is built by the platform from source in git, not from an image a
# developer pushed. That is the source-build beat, made structural.
#
# DO NOT write a Workload for this component. The build generates
# loan-api-go-workload itself from the image plus app/loan-api-go/workload.yaml in
# the source repo (read at build time — commit it BEFORE triggering the build).
# Without that descriptor the generated Workload has only container.image: no
# endpoints, no env, no dependencies, and the container dies at startup with
# "LOG_LEVEL is required but was not set".
#
# repository.url is this repository. A private repo needs `secretRef` pointing at
# a SecretReference in this namespace that holds git credentials.
#
# With autoDeploy: true the component deploys into development as soon as the
# build has generated its Workload. Then read its external URL from the binding
# and put it into both frontends' API_BASE_URL (24-workloads.yaml).
---
apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: loan-api-go
  namespace: kifaru-bank
  annotations:
    openchoreo.dev/display-name: loan-api-go
    openchoreo.dev/description: Public loan API (Go), built from source with a Dockerfile
spec:
  owner:
    projectName: lending
  componentType:
    kind: ComponentType
    name: deployment/public-api
  autoDeploy: true
  workflow:
    kind: ClusterWorkflow
    name: dockerfile-builder
    parameters:
      repository:
        url: https://github.com/kaviththiranga/2026-NBO-Internal-Developer-Platform-tutorial-1
        appPath: app/loan-api-go            # where the builder looks for workload.yaml
        revision:
          branch: main
      docker:
        context: app/loan-api-go
        filePath: app/loan-api-go/Dockerfile
