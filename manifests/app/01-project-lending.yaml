# D1 — the project, and one cell per environment.
#
# GENERATED BY:
#   occ project scaffold lending --projecttype bank-cell --namespace kifaru-bank
#
# The scaffold is driven by the platform's ProjectType schema: the two parameters
# below are the ones bank-cell demands. costCentre must match ^CC-[0-9]{4}$ and
# dataClassification: public is refused at render time (try it — it is the
# earliest refusal beat in the whole platform: no component, no image, no cell).
#
# type is IMMUTABLE after creation. kind: ProjectType is the team's own
# namespace-scoped type (manifests/platform/04-projecttype-bank-cell.yaml).
#
# The three ProjectReleaseBindings are what CREATE the cells — one namespace on
# the data plane per environment (dp-kifaru-bank-lending-<env>-<hash>). Nothing
# deploys into an environment until its cell exists.
---
apiVersion: openchoreo.dev/v1alpha1
kind: Project
metadata:
  name: lending
  namespace: kifaru-bank
spec:
  deploymentPipelineRef:
    name: default
  type:
    kind: ProjectType
    name: bank-cell
  parameters:
    costCentre: CC-4417 # Finance cost centre, stamped onto every cell for chargeback.
    dataClassification: confidential
---
apiVersion: openchoreo.dev/v1alpha1
kind: ProjectReleaseBinding
metadata:
  name: lending-development
  namespace: kifaru-bank
spec:
  owner:
    projectName: lending
  environment: development
---
apiVersion: openchoreo.dev/v1alpha1
kind: ProjectReleaseBinding
metadata:
  name: lending-staging
  namespace: kifaru-bank
spec:
  owner:
    projectName: lending
  environment: staging
---
apiVersion: openchoreo.dev/v1alpha1
kind: ProjectReleaseBinding
metadata:
  name: lending-production
  namespace: kifaru-bank
spec:
  owner:
    projectName: lending
  environment: production
