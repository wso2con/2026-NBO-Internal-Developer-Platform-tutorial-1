# D4 — the six pre-built components.
#
# GENERATED BY (one per component, then concatenated):
#   occ component scaffold credit-scoring --componenttype deployment/internal-engine \
#     -n kifaru-bank -p lending
#
# NONE of these has a `workflow`: they run images already in a registry. Adding a
# workflow turns a component into a source build. loan-api-go is the opposite
# case and lives in 25-component-loan-api-go.yaml.
#
# componentType is the team's own namespace-scoped ComponentType (manifests/platform/05-09)
# and carries the WHOLE "workloadType/name" string. It is IMMUTABLE.
# autoDeploy deploys to the FIRST environment in the pipeline only (development);
# promotion to staging is a separate, deliberate act.
---
apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: credit-scoring
  namespace: kifaru-bank
spec:
  owner:
    projectName: lending
  componentType:
    kind: ComponentType
    name: deployment/internal-engine
  autoDeploy: true
